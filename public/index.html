<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rylics</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px system-ui, -apple-system, sans-serif;
      background: #10101c;
      color: #f6f4ff;
    }
    .app { max-width: 900px; margin: auto; padding: 18px; }
    h1 { margin-bottom: 4px; color: #bca8ff; }
    .muted { color: #aaa7bc; font-size: 0.95rem; }
    .panel {
      background: #1d1c2d;
      border: 1px solid #37344d;
      border-radius: 16px;
      padding: 16px;
      margin: 14px 0;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    input, select, button {
      font: inherit;
      border-radius: 9px;
      padding: 11px;
    }
    input, select {
      background: #10101c;
      color: white;
      border: 1px solid #514d68;
    }
    input { flex: 1; min-width: 180px; }
    button {
      background: #a88cff;
      color: #171223;
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }
    button:disabled { opacity: .55; cursor: wait; }
    #chat {
      height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      padding: 12px 15px;
      border-radius: 13px;
      max-width: 88%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { background: #51418c; align-self: flex-end; }
    .assistant { background: #303047; align-self: flex-start; }
    .status { min-height: 24px; color: #c6b6ff; font-size: 0.9rem; margin-top: 6px; }
    label { display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🎭 Rylics</h1>
    <p class="muted">Your AI assistant, your custom characters, your voice settings.</p>

    <section class="panel">
      <div class="row">
        <select id="characterSelect" aria-label="Choose character"></select>
        <button id="clearButton" type="button">Clear chat</button>
      </div>
      <p id="characterDescription" class="muted"></p>

      <form id="createForm" class="row">
        <input
          id="characterPrompt"
          maxlength="1000"
          placeholder="Describe a new AI character..."
          required
        />
        <button type="submit">Generate</button>
      </form>
    </section>

    <section class="panel">
      <div class="row">
        <label>
          <input id="speakToggle" type="checkbox" />
          Read replies aloud
        </label>
        <select id="voiceSelect" aria-label="Choose browser voice"></select>
      </div>
    </section>

    <section class="panel">
      <div id="chat" aria-live="polite"></div>
      <p id="status" class="status" role="status"></p>
      <form id="chatForm" class="row">
        <input id="messageInput" placeholder="Ask Rylics anything..." required />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script>
    const defaultCharacter = {
      id: "default",
      name: "Rylics",
      personality: "Friendly, clear, creative, and helpful with a wide range of tasks.",
      voiceHint: "clear and friendly"
    };

    function load(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key)) ?? fallback;
      } catch {
        return fallback;
      }
    }

    let characters = load("rylics-characters", [defaultCharacter]);
    if (!Array.isArray(characters) || characters.length === 0) {
      characters = [defaultCharacter];
    }

    let messages = load("rylics-messages", []);
    if (!Array.isArray(messages)) messages = [];

    let selectedId = localStorage.getItem("rylics-selected") || characters[0].id;

    const $ = (id) => document.getElementById(id);
    const chat = $("chat");
    const status = $("status");

    function save() {
      localStorage.setItem("rylics-characters", JSON.stringify(characters));
      localStorage.setItem("rylics-messages", JSON.stringify(messages));
      localStorage.setItem("rylics-selected", selectedId);
    }

    function selectedCharacter() {
      return characters.find((character) => character.id === selectedId)
        || characters[0];
    }

    function renderCharacters() {
      const select = $("characterSelect");
      select.replaceChildren();

      for (const character of characters) {
        const option = document.createElement("option");
        option.value = character.id;
        option.textContent = character.name;
        select.append(option);
      }

      select.value = selectedCharacter().id;
      $("characterDescription").textContent =
        selectedCharacter().personality;
    }

    function addBubble(role, text, name) {
      const bubble = document.createElement("div");
      bubble.className = `message ${role}`;
      bubble.textContent = role === "assistant" ? `${name}: ${text}` : text;
      chat.append(bubble);
      chat.scrollTop = chat.scrollHeight;
    }

    function renderMessages() {
      chat.replaceChildren();
      for (const message of messages) {
        addBubble(
          message.role,
          message.content,
          message.name || "Rylics"
        );
      }
    }

    async function postJSON(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed.");
      return data;
    }

    function availableVoices() {
      if (!("speechSynthesis" in window)) return;
      const select = $("voiceSelect");
      const previous = select.value;
      select.replaceChildren();

      const voices = speechSynthesis.getVoices();
      for (const voice of voices) {
        const option = document.createElement("option");
        option.value = voice.voiceURI;
        option.textContent = `${voice.name} (${voice.lang})`;
        select.append(option);
      }

      if (voices.some((voice) => voice.voiceURI === previous)) {
        select.value = previous;
      }
    }

    function speak(text) {
      if (!$("speakToggle").checked || !("speechSynthesis" in window)) return;

      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voice = speechSynthesis.getVoices().find(
        (item) => item.voiceURI === $("voiceSelect").value
      );
      if (voice) utterance.voice = voice;
      speechSynthesis.speak(utterance);
    }

    $("characterSelect").addEventListener("change", (event) => {
      selectedId = event.target.value;
      renderCharacters();
      save();
    });

    $("clearButton").addEventListener("click", () => {
      messages = [];
      speechSynthesis?.cancel();
      renderMessages();
      save();
      status.textContent = "Chat cleared.";
    });

    $("createForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = event.target.querySelector("button");
      button.disabled = true;
      status.textContent = "Creating character...";

      try {
        const { character } = await postJSON("/api/characters/generate", {
          prompt: $("characterPrompt").value.trim()
        });
        characters.push(character);
        selectedId = character.id;
        $("characterPrompt").value = "";
        renderCharacters();
        save();
        status.textContent = `${character.name} created!`;
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    $("chatForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const input = $("messageInput");
      const text = input.value.trim();
      if (!text) return;

      const character = selectedCharacter();
      const button = event.target.querySelector("button");
      button.disabled = true;
      input.value = "";
      status.textContent = `${character.name} is thinking...`;

      const userMessage = { role: "user", content: text };
      messages.push(userMessage);
      addBubble("user", text);
      save();

      try {
        const { reply } = await postJSON("/api/chat", {
          character,
          messages: messages.map(({ role, content }) => ({ role, content }))
        });

        messages.push({
          role: "assistant",
          content: reply,
          name: character.name
        });
        addBubble("assistant", reply, character.name);
        speak(reply);
        save();
        status.textContent = "";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
        input.focus();
      }
    });

    renderCharacters();
    renderMessages();
    availableVoices();
    if ("speechSynthesis" in window) {
      speechSynthesis.onvoiceschanged = availableVoices;
    }
  </script>
</body>
</html>
